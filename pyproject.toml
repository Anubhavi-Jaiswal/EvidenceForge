[project]
name = "evidenceforge"
version = "0.1.0"
description = "Reproducible, evidence-grounded repository quality assessment workflow"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["evidenceforge"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
